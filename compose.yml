
services:
  bl3auto:
    #build: .
    container_name: bl3auto
    image: jauderho/bl3auto:latest
    # Credentials via the environment rather than -e/-p, which show up in `ps`.
    environment:
      BL3_EMAIL: ${BL3_EMAIL}
      BL3_PASSWORD: ${BL3_PASSWORD}
    volumes:
      - './codes:/root/.config/bl3auto/bl3auto'

volumes:
  codes:
